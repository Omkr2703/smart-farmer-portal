# Every push to main rebuilds the demo site and publishes it to the gh-pages branch.
# Live link: https://omkr2703.github.io/smart-farmer-portal/
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build demo
        working-directory: client
        run: |
          npm ci
          GITHUB_PAGES=true npm run build
          touch dist/.nojekyll
      - name: Publish to gh-pages branch
        working-directory: client/dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy demo from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
